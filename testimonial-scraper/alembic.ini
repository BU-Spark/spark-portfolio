# Alembic configuration for the Testimonial scraper.
# DATABASE_URL is read from the environment in migrations/env.py — do NOT
# hardcode a sqlalchemy.url here.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

# Use a timestamped, slug-friendly revision filename.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# sqlalchemy.url is intentionally left blank; env.py injects it from DATABASE_URL.
sqlalchemy.url =

[post_write_hooks]
# (optional) run formatters on generated migrations; left disabled by default.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
