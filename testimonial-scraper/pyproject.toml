[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spark-testimonial"
version = "0.1.0"
description = "Walks social platforms for Spark testimonials, ties them to projects, and summarizes them."
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "psycopg[binary]==3.2.3",
    "pydantic==2.10.6",
    "pydantic-settings==2.6.1",
    "anthropic>=0.77.1",
    "httpx==0.28.1",
    "python-dotenv==1.0.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
# Source lives under src/ (src layout). Tell Pyright so cross-package imports
# like `testimonial.credentials.base` resolve without an editable install.
extraPaths = ["src"]
